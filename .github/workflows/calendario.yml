name: Atualizar calendário

on:
  schedule:
    - cron: "17 */3 * * *"   # de 3 em 3 horas
  workflow_dispatch:         # botão "Run workflow" para correr à mão

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install requests
      - name: Ler calendário da Feels Like Home
        env:
          FLH_USER: ${{ secrets.FLH_USER }}
          FLH_PASS: ${{ secrets.FLH_PASS }}
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: python scripts/sync_calendario.py
      - name: Gravar alterações
        run: |
          git config user.name "calendario-bot"
          git config user.email "calendario-bot@users.noreply.github.com"
          git add disponibilidade.json
          git diff --cached --quiet || git commit -m "Atualiza disponibilidade"
          git push
